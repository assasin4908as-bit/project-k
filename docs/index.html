<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010005;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(75, 0, 45, 0.22),
            rgba(2, 0, 6, 0.98) 58%
        );

    transition:
        opacity 2.2s ease,
        visibility 2.2s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;

    background: #ff315f;

    box-shadow:
        0 0 12px #ff315f,
        0 0 40px rgba(255, 40, 100, 0.8),
        0 0 100px rgba(255, 0, 80, 0.35);

    animation:
        introPulse 2s ease-in-out infinite;
}

#introText {
    margin-top: 34px;

    color: rgba(255,255,255,0.8);

    font-size: 17px;
    line-height: 1.7;

    letter-spacing: 1.5px;

    text-align: center;

    opacity: 0;

    animation:
        introTextAppear 2.5s 0.8s forwards;
}

#enterButton {
    margin-top: 28px;

    padding: 13px 30px;

    border:
        1px solid
        rgba(255, 80, 120, 0.45);

    border-radius: 40px;

    background:
        rgba(20, 0, 10, 0.4);

    color:
        rgba(255,255,255,0.88);

    font-family: Georgia, serif;

    font-size: 15px;

    letter-spacing: 1.5px;

    cursor: pointer;

    opacity: 0;

    animation:
        introTextAppear 2s 2s forwards;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
}

#enterButton:hover {
    transform: scale(1.06);

    border-color:
        rgba(255, 100, 140, 0.9);

    box-shadow:
        0 0 30px
        rgba(255, 30, 90, 0.28);
}

#hint,
#maskHint {
    position: fixed;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    pointer-events: none;

    text-align: center;

    opacity: 0;

    transition:
        opacity 1.5s ease;
}

#hint {
    bottom: 28px;

    color:
        rgba(255,255,255,0.5);

    font-size: 14px;

    letter-spacing: 1.2px;
}

#maskHint {
    bottom: 58px;

    color:
        rgba(255,210,220,0.72);

    font-size: 13px;

    letter-spacing: 1px;
}

#hint.show,
#maskHint.show {
    opacity: 1;
}

@keyframes introPulse {

    0%, 100% {
        transform: scale(0.7);
        opacity: 0.5;
    }

    50% {
        transform: scale(1.8);
        opacity: 1;
    }
}

@keyframes introTextAppear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<!-- =====================================================
     ВХОД
===================================================== -->

<div id="intro">

    <div class="intro-dot"></div>

    <div id="introText">
        Иногда, чтобы узнать человека,<br>
        нужно заглянуть немного глубже…
    </div>

    <button id="enterButton">
        Войти
    </button>

</div>

<div id="hint">
    Нажмите на сердце, чтобы узнать меня лучше
</div>

<div id="maskHint">
    Нажмите на маску
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ОСНОВА
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x010005);


const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    0,
    0,
    34
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   PARTICLE TEXTURE
===================================================== */

function createParticleTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.12,
        "rgba(255,255,255,0.98)"
    );

    gradient.addColorStop(
        0.3,
        "rgba(255,100,150,0.8)"
    );

    gradient.addColorStop(
        0.6,
        "rgba(255,20,90,0.3)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,0,80,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        128,
        128
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


const particleTexture =
    createParticleTexture();


/* =====================================================
   ФОН
===================================================== */

const backgroundCount =
    10000;

const backgroundPositions =
    new Float32Array(
        backgroundCount * 3
    );


for (
    let i = 0;
    i < backgroundCount;
    i++
) {

    const i3 =
        i * 3;

    const radius =
        70 +
        Math.random() * 170;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 *
            Math.random() -
            1
        );

    backgroundPositions[i3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    backgroundPositions[i3 + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    backgroundPositions[i3 + 2] =
        radius *
        Math.cos(phi);
}


const backgroundGeometry =
    new THREE.BufferGeometry();

backgroundGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        backgroundPositions,
        3
    )
);


const backgroundMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0x7b1745,

        size:
            0.32,

        transparent:
            true,

        opacity:
            0.42,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        sizeAttenuation:
            true
    });


const backgroundParticles =
    new THREE.Points(
        backgroundGeometry,
        backgroundMaterial
    );

scene.add(
    backgroundParticles
);


/* =====================================================
   ❤️ HEART
===================================================== */

const heartGroup =
    new THREE.Group();

scene.add(
    heartGroup
);


const heartCount =
    34000;

const heartPositions =
    new Float32Array(
        heartCount * 3
    );

const heartOriginal =
    [];


/*
   Более широкое,
   круглое и объёмное сердце.
*/

for (
    let i = 0;
    i < heartCount;
    i++
) {

    const i3 =
        i * 3;


    const angle =
        Math.random() *
        Math.PI * 2;


    /*
       Плотное заполнение.
    */

    const fill =
        Math.pow(
            Math.random(),
            0.42
        );


    let x =
        16 *
        Math.pow(
            Math.sin(angle),
            3
        );


    let y =
        13 *
        Math.cos(angle)
        -
        5 *
        Math.cos(
            angle * 2
        )
        -
        2 *
        Math.cos(
            angle * 3
        )
        -
        Math.cos(
            angle * 4
        );


    /*
       Заполнение.
    */

    x *= fill;
    y *= fill;


    /*
       Делаем сердце
       шире и округлее.
    */

    x *= 0.70;
    y *= 0.67;


    /*
       Большой объём по Z.
    */

    const depth =
        Math.sqrt(
            Math.max(
                0,
                1 -
                fill *
                fill
            )
        );


    let z =
        (
            Math.random() -
            0.5
        ) *
        8 *
        depth;


    /*
       Передняя часть
       слегка выпуклая.
    */

    z +=
        Math.sin(
            fill *
            Math.PI
        ) *
        1.15;


    /*
       Общий масштаб.
    */

    x *= 0.68;
    y *= 0.68;
    z *= 0.68;


    heartPositions[i3] =
        x;

    heartPositions[i3 + 1] =
        y;

    heartPositions[i3 + 2] =
        z;


    heartOriginal.push({
        x,
        y,
        z
    });
}


const heartGeometry =
    new THREE.BufferGeometry();

heartGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        heartPositions,
        3
    )
);


const heartMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xff315f,

        size:
            0.125,

        transparent:
            true,

        opacity:
            0.92,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        sizeAttenuation:
            true
    });


const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );

heartGroup.add(
    heart
);


heartGroup.position.y =
    2;


/* =====================================================
   HEART GLOW
===================================================== */

const heartGlowMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xff174f,

        size:
            0.42,

        transparent:
            true,

        opacity:
            0.13,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const heartGlow =
    new THREE.Points(
        heartGeometry,
        heartGlowMaterial
    );

heartGroup.add(
    heartGlow
);


/* =====================================================
   БЕЛЫЕ ЧАСТИЦЫ ВОКРУГ СЕРДЦА
===================================================== */

const whiteCount =
    9000;

const whitePositions =
    new Float32Array(
        whiteCount * 3
    );

const whiteData =
    [];


for (
    let i = 0;
    i < whiteCount;
    i++
) {

    const i3 =
        i * 3;


    const side =
        Math.random() < 0.5
        ? -1
        : 1;


    /*
       Широкие потоки
       слева и справа.
    */

    const angle =
        Math.random() *
        Math.PI;


    const radius =
        5 +
        Math.random() *
        6;


    const x =
        side *
        (
            5 +
            Math.cos(angle) *
            radius
        );


    const y =
        0.5 +
        Math.sin(angle) *
        4.5;


    const z =
        (
            Math.random() -
            0.5
        ) *
        7;


    whitePositions[i3] =
        x;

    whitePositions[i3 + 1] =
        y;

    whitePositions[i3 + 2] =
        z;


    whiteData.push({
        angle:
            angle,

        radius:
            radius,

        side:
            side,

        speed:
            0.001 +
            Math.random() *
            0.004
    });
}


const whiteGeometry =
    new THREE.BufferGeometry();

whiteGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        whitePositions,
        3
    )
);


const whiteMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffffff,

        size:
            0.095,

        transparent:
            true,

        opacity:
            0.82,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        sizeAttenuation:
            true
    });


const whiteParticles =
    new THREE.Points(
        whiteGeometry,
        whiteMaterial
    );

scene.add(
    whiteParticles
);


/* =====================================================
   БЕЛЫЕ ПОТОКИ СНИЗУ
===================================================== */

const lowerCount =
    7500;

const lowerPositions =
    new Float32Array(
        lowerCount * 3
    );

const lowerData =
    [];


for (
    let i = 0;
    i < lowerCount;
    i++
) {

    const i3 =
        i * 3;


    const p =
        Math.random();


    /*
       Поток начинается
       под сердцем.
    */

    const y =
        -4.5 -
        p * 8;


    /*
       Чем ниже,
       тем шире поток.
    */

    const spread =
        1.5 +
        p * 9;


    const x =
        (
            Math.random() -
            0.5
        ) *
        spread;


    /*
       Глубина.
    */

    const z =
        (
            Math.random() -
            0.5
        ) *
        (
            1.5 +
            p * 5
        );


    lowerPositions[i3] =
        x;

    lowerPositions[i3 + 1] =
        y;

    lowerPositions[i3 + 2] =
        z;


    lowerData.push({
        p:
            p,

        phase:
            Math.random() *
            Math.PI *
            2,

        speed:
            0.003 +
            Math.random() *
            0.008
    });
}


const lowerGeometry =
    new THREE.BufferGeometry();

lowerGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        lowerPositions,
        3
    )
);


const lowerMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffdce6,

        size:
            0.09,

        transparent:
            true,

        opacity:
            0.62,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const lowerParticles =
    new THREE.Points(
        lowerGeometry,
        lowerMaterial
    );

scene.add(
    lowerParticles
);


/* =====================================================
   ОТРАЖЕНИЕ ПОД СЕРДЦЕМ
===================================================== */

const reflectionCount =
    4500;

const reflectionPositions =
    new Float32Array(
        reflectionCount * 3
    );


for (
    let i = 0;
    i < reflectionCount;
    i++
) {

    const i3 =
        i * 3;


    const p =
        Math.random();


    const x =
        (
            Math.random() -
            0.5
        ) *
        (
            5 +
            p * 16
        );


    const y =
        -7.2 -
        p * 4;


    const z =
        (
            Math.random() -
            0.5
        ) *
        3;


    reflectionPositions[i3] =
        x;

    reflectionPositions[i3 + 1] =
        y;

    reflectionPositions[i3 + 2] =
        z;
}


const reflectionGeometry =
    new THREE.BufferGeometry();

reflectionGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        reflectionPositions,
        3
    )
);


const reflectionMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xff426e,

        size:
            0.065,

        transparent:
            true,

        opacity:
            0.22,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const reflection =
    new THREE.Points(
        reflectionGeometry,
        reflectionMaterial
    );

scene.add(
    reflection
);


/* =====================================================
   🌙 ПОЛУМЕСЯЦ
===================================================== */

const moonGroup =
    new THREE.Group();

scene.add(
    moonGroup
);


const moonCount =
    7000;

const moonPositions =
    new Float32Array(
        moonCount * 3
    );

let moonIndex =
    0;


/*
   Формируем именно серп,
   а не полный круг.
*/

while (
    moonIndex <
    moonCount
) {

    const x =
        (
            Math.random() -
            0.5
        ) *
        7.5;


    const y =
        (
            Math.random() -
            0.5
        ) *
        7.5;


    const outer =
        x * x +
        y * y;


    if (
        outer >
        14
    ) {
        continue;
    }


    /*
       Вырез справа.
    */

    const cutX =
        x -
        2.1;


    const cutY =
        y;


    const inner =
        cutX * cutX +
        cutY * cutY;


    if (
        inner <
        8.5
    ) {
        continue;
    }


    const i3 =
        moonIndex *
        3;


    moonPositions[i3] =
        x;

    moonPositions[i3 + 1] =
        y;

    moonPositions[i3 + 2] =
        (
            Math.random() -
            0.5
        ) *
        1.5;


    moonIndex++;
}


const moonGeometry =
    new THREE.BufferGeometry();

moonGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        moonPositions,
        3
    )
);


const moonMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xfff4c7,

        size:
            0.115,

        transparent:
            true,

        opacity:
            0.94,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const moon =
    new THREE.Points(
        moonGeometry,
        moonMaterial
    );

moonGroup.add(
    moon
);


/*
   Дальняя орбита.
*/

let moonAngle =
    0;

const moonOrbitX =
    17;

const moonOrbitZ =
    13;


function updateMoon() {

    moonAngle +=
        0.0015;


    moonGroup.position.x =
        Math.cos(
            moonAngle
        ) *
        moonOrbitX;


    moonGroup.position.z =
        Math.sin(
            moonAngle
        ) *
        moonOrbitZ;


    moonGroup.position.y =
        5 +
        Math.sin(
            moonAngle *
            2
        ) *
        3;


    moon.rotation.y +=
        0.002;

    moon.rotation.z +=
        0.001;
}


/* =====================================================
   🎭 МАСКА ОНИ
===================================================== */

const maskGroup =
    new THREE.Group();

scene.add(
    maskGroup
);


maskGroup.position.set(
    -12,
    -1,
    2
);


const maskCount =
    8500;

const maskPositions =
    new Float32Array(
        maskCount * 3
    );

const maskBase =
    [];


for (
    let i = 0;
    i < maskCount;
    i++
) {

    const i3 =
        i * 3;


    const angle =
        Math.random() *
        Math.PI *
        2;


    const radius =
        Math.sqrt(
            Math.random()
        );


    /*
       Большое лицо Они.
    */

    let x =
        Math.cos(angle) *
        4.3 *
        radius;


    let y =
        Math.sin(angle) *
        5.1 *
        radius;


    /*
       Нижняя часть
       немного уже.
    */

    if (
        y < 0
    ) {

        x *=
            0.88;
    }


    /*
       Выпуклость.
    */

    const normalized =
        (
            x * x
        ) /
        (
            4.3 *
            4.3
        )
        +
        (
            y * y
        ) /
        (
            5.1 *
            5.1
        );


    const depth =
        Math.sqrt(
            Math.max(
                0,
                1 -
                normalized
            )
        );


    const z =
        depth *
        2.0;


    maskPositions[i3] =
        x;

    maskPositions[i3 + 1] =
        y;

    maskPositions[i3 + 2] =
        z;


    maskBase.push({
        x,
        y,
        z
    });
}


const maskGeometry =
    new THREE.BufferGeometry();

maskGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        maskPositions,
        3
    )
);


const maskMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xb72d5b,

        size:
            0.095,

        transparent:
            true,

        opacity:
            0.78,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const mask =
    new THREE.Points(
        maskGeometry,
        maskMaterial
    );

maskGroup.add(
    mask
);


/* =====================================================
   РОГА
===================================================== */

function createHorn(
    side
) {

    const count =
        2200;

    const positions =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const i3 =
            i * 3;


        const p =
            Math.random();


        /*
           Рога вверх.
        */

        const y =
            3.2 +
            p * 5.5;


        const curve =
            Math.sin(
                p *
                Math.PI
            ) *
            1.1;


        const x =
            side *
            (
                2.2 +
                p *
                2.0 +
                curve
            );


        positions[i3] =
            x +
            (
                Math.random() -
                0.5
            ) *
            0.55;


        positions[i3 + 1] =
            y +
            (
                Math.random() -
                0.5
            ) *
            0.55;


        positions[i3 + 2] =
            1.2 +
            Math.random() *
            1.0;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            map:
                particleTexture,

            color:
                0x8f173d,

            size:
                0.105,

            transparent:
                true,

            opacity:
                0.9,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending
        });


    return new THREE.Points(
        geometry,
        material
    );
}


const leftHorn =
    createHorn(-1);

const rightHorn =
    createHorn(1);

maskGroup.add(
    leftHorn
);

maskGroup.add(
    rightHorn
);


/* =====================================================
   ГЛАЗА
===================================================== */

function createEye(
    side
) {

    const count =
        700;

    const positions =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const i3 =
            i * 3;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const radius =
            Math.sqrt(
                Math.random()
            );


        positions[i3] =
            side *
            (
                1.15 +
                Math.cos(angle) *
                0.48 *
                radius
            );


        positions[i3 + 1] =
            0.8 +
            Math.sin(angle) *
            0.25 *
            radius;


        positions[i3 + 2] =
            1.8;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            map:
                particleTexture,

            color:
                0xff6b91,

            size:
                0.12,

            transparent:
                true,

            opacity:
                0.95,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending
        });


    return new THREE.Points(
        geometry,
        material
    );
}


const leftEye =
    createEye(-1);

const rightEye =
    createEye(1);

maskGroup.add(
    leftEye
);

maskGroup.add(
    rightEye
);


/* =====================================================
   TEXT PARTICLES
===================================================== */

let textParticles =
    null;

let textTarget =
    [];

let textProgress =
    0;

let textActive =
    false;


/*
   Canvas используется только
   как карта расположения букв.

   На экране остаются только частицы.
*/

function createParticleText(
    text
) {

    if (
        textParticles
    ) {

        scene.remove(
            textParticles
        );

        textParticles.geometry.dispose();

        textParticles.material.dispose();
    }


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        1200;

    canvas.height =
        300;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        1200,
        300
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 82px Georgia";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        text,
        600,
        150
    );


    const image =
        ctx.getImageData(
            0,
            0,
            1200,
            300
        );


    const points =
        [];


    const step =
        5;


    for (
        let y = 0;
        y < 300;
        y += step
    ) {

        for (
            let x = 0;
            x < 1200;
            x += step
        ) {

            const alpha =
                image.data[
                    (
                        y *
                        1200 +
                        x
                    ) *
                    4 +
                    3
                ];


            if (
                alpha > 100
            ) {

                points.push({

                    x:
                        (
                            x -
                            600
                        ) *
                        0.024,

                    y:
                        -(
                            y -
                            150
                        ) *
                        0.024,

                    z:
                        (
                            Math.random() -
                            0.5
                        ) *
                        0.6
                });
            }
        }
    }


    const positions =
        new Float32Array(
            points.length * 3
        );


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        positions[i * 3] =
            points[i].x;

        positions[i * 3 + 1] =
            points[i].y;

        positions[i * 3 + 2] =
            points[i].z;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            map:
                particleTexture,

            color:
                0xffc2d0,

            size:
                0.12,

            transparent:
                true,

            opacity:
                0,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending
        });


    textParticles =
        new THREE.Points(
            geometry,
            material
        );


    textParticles.position.set(
        0,
        -6,
        4
    );


    scene.add(
        textParticles
    );


    textProgress =
        0;

    textActive =
        true;
}


/* =====================================================
   МАСКА РАССЫПАЕТСЯ
===================================================== */

let maskExploding =
    false;

let maskExplosion =
    0;


function explodeMask() {

    if (
        maskExploding
    ) {
        return;
    }


    maskExploding =
        true;


    maskExplosion =
        0;


    createParticleText(
        "Узнай меня глубже"
    );
}


/* =====================================================
   CLICK
===================================================== */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2(
        999,
        999
    );


window.addEventListener(
    "pointermove",
    event => {

        mouse.x =
            (
                event.clientX /
                window.innerWidth
            ) *
            2 -
            1;


        mouse.y =
            -(
                event.clientY /
                window.innerHeight
            ) *
            2 +
            1;
    }
);


window.addEventListener(
    "click",
    () => {

        if (
            !entered
        ) {
            return;
        }


        raycaster.setFromCamera(
            mouse,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                [
                    mask,
                    leftHorn,
                    rightHorn,
                    leftEye,
                    rightEye
                ],
                true
            );


        if (
            hits.length > 0
        ) {

            explodeMask();
        }
    }
);

let mouseX =

let mouseY =
    0;


window.addEventListener(

    event => {

/* =====================================================
   HEART ANIMATION
===================================================== */

let elapsed =
    0;


function updateHeart() {

    elapsed +=
        0.016;


    /*
       Сердцебиение.
    */

    const beat =
        1 +
        Math.sin(
            elapsed *
            2.4
        ) *
        0.018 +
        Math.sin(
            elapsed *
            4.8
        ) *
        0.007;


    heartGroup.scale.set(
        beat,
        beat,
        beat
    );


    /*
       Медленное вращение.
    */

    heartGroup.rotation.y +=
        0.0028;


    heartGroup.rotation.x =
        Math.sin(
            elapsed *
            0.25
        ) *
        0.035;
}


/* =====================================================
   БЕЛЫЕ ЧАСТИЦЫ
===================================================== */

function updateWhiteParticles() {

    const positions =
        whiteGeometry
            .attributes
            .position
            .array;


    for (
        let i = 0;
        i < whiteCount;
        i++
    ) {

        const i3 =
            i * 3;


        const data =
            whiteData[i];


        data.angle +=
            data.speed;


        /*
           Волнообразное движение.
        */

        const wave =
            Math.sin(
                elapsed *
                0.8 +
                data.angle *
                2
            ) *
            0.5;


        positions[i3] =
            data.side *
            (
                5 +
                Math.cos(
                    data.angle
                ) *
                data.radius
            );


        positions[i3 + 1] =
            0.5 +
            Math.sin(
                data.angle
            ) *
            4.5 +
            wave;


        positions[i3 + 2] =
            Math.sin(
                data.angle *
                2
            ) *
            1.8;
    }


    whiteGeometry
        .attributes
        .position
        .needsUpdate =
        true;
}


/* =====================================================
   НИЖНИЕ ПОТОКИ
===================================================== */

function updateLowerParticles() {

    const positions =
        lowerGeometry
            .attributes
            .position
            .array;


    for (
        let i = 0;
        i < lowerCount;
        i++
    ) {

        const i3 =
            i * 3;


        const data =
            lowerData[i];


        data.phase +=
            data.speed;


        const wave =
            Math.sin(
                data.phase
            );


        const spread =
            1.5 +
            data.p *
            9;


        /*
           Частицы колышутся
           как ткань/поток.
        */

        positions[i3] +=
            wave *
            0.008;


        positions[i3 + 2] =
            Math.sin(
                data.phase *
                0.7
            ) *
            (
                0.8 +
                data.p *
                3
            );


        /*
           лёгкое движение вверх.
        */

        positions[i3 + 1] +=
            0.002;


        if (
            positions[i3 + 1] >
            -4
        ) {

            positions[i3 + 1] =
                -12 -
                Math.random() *
                4;

            positions[i3] =
                (
                    Math.random() -
                    0.5
                ) *
                spread;
        }
    }


    lowerGeometry
        .attributes
        .position
        .needsUpdate =
        true;
}


/* =====================================================
   МАСКА
===================================================== */

function updateMask() {

    if (
        !maskExploding
    ) {

        maskGroup.rotation.y +=
            0.002;


        maskGroup.position.y =
            -1 +
            Math.sin(
                elapsed *
                0.6
            ) *
            0.25;


        return;
    }


    maskExplosion +=
        0.018;


    const positions =
        maskGeometry
            .attributes
            .position
            .array;


    for (
        let i = 0;
        i < maskCount;
        i++
    ) {

        const i3 =
            i * 3;


        const base =
            maskBase[i];


        const distance =
            1 +
            maskExplosion *
            7;


        positions[i3] =
            base.x *
            distance;


        positions[i3 + 1] =
            base.y *
            distance;


        positions[i3 + 2] =
            base.z *
            distance;
    }


    maskGeometry
        .attributes
        .position
        .needsUpdate =
        true;


    maskMaterial.opacity =
        Math.max(
            0,
            0.78 -
            maskExplosion
        );


    leftHorn.visible =
        maskExplosion <
        0.5;

    rightHorn.visible =
        maskExplosion <
        0.5;

    leftEye.visible =
        maskExplosion <
        0.5;

    rightEye.visible =
        maskExplosion <
        0.5;


    /*
       Собираем текст.
    */

    if (
        textParticles
    ) {

        textProgress =
            Math.min(
                1,
                textProgress +
                0.012
            );


        textParticles.material.opacity =
            textProgress;


        textParticles.scale.setScalar(
            0.65 +
            textProgress *
            0.35
        );


        /*
           Лёгкое вращение
           объёмного текста.
        */

        textParticles.rotation.y =
            Math.sin(
                elapsed *
                0.35
            ) *
            0.04;
    }
}


/* =====================================================
   ОБЩИЙ МИР
===================================================== */

function updateWorld() {

    backgroundParticles.rotation.y +=
        0.00022;

    backgroundParticles.rotation.x +=
        0.00006;


    reflection.rotation.y +=
        0.0004;


    /*
       Камера реагирует
       на движение мыши.
    */

    camera.position.x +=
        (
            mouseX *
            3 -
            camera.position.x
        ) *
        0.015;


    camera.position.y +=
        (
            -mouseY *
            2 -
            camera.position.y
        ) *
        0.015;


    camera.lookAt(
        0,
        0,
        0
    );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updateHeart();

    updateWhiteParticles();

    updateLowerParticles();

    updateMoon();

    updateMask();

    updateWorld();


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>
