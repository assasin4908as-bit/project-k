<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Our Story — Alex & Marina ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #010005;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    position: relative;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(90, 0, 45, 0.20),
            rgba(1, 0, 5, 0.98) 62%
        );

    transition:
        opacity 2s ease,
        visibility 2s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff315f;

    box-shadow:
        0 0 15px #ff315f,
        0 0 45px rgba(255, 30, 90, 0.8),
        0 0 110px rgba(255, 0, 80, 0.4);

    animation: pulse 2s ease-in-out infinite;
}

#introText {
    margin-top: 35px;

    color: rgba(255,255,255,0.82);
    font-size: 17px;
    line-height: 1.8;
    letter-spacing: 1.5px;
    text-align: center;

    opacity: 0;

    animation:
        appear 2.5s 0.7s forwards;
}

#enterButton {
    margin-top: 30px;

    padding: 13px 34px;

    border: 1px solid rgba(255,80,120,0.45);
    border-radius: 40px;

    background: rgba(25,0,12,0.4);

    color: rgba(255,255,255,0.9);

    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 1.5px;

    cursor: pointer;

    opacity: 0;

    animation:
        appear 2s 2s forwards;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

#enterButton:hover {
    transform: scale(1.07);

    border-color:
        rgba(255,100,140,0.9);

    box-shadow:
        0 0 35px
        rgba(255,30,90,0.3);
}

#hint,
#maskHint,
#zoomHint {
    position: fixed;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    pointer-events: none;

    text-align: center;

    opacity: 0;

    transition: opacity 1.5s ease;
}

#hint {
    bottom: 30px;

    color:
        rgba(255,255,255,0.5);

    font-size: 14px;
    letter-spacing: 1.2px;
}

#maskHint {
    bottom: 58px;

    color:
        rgba(255,215,225,0.7);

    font-size: 13px;
    letter-spacing: 1px;
}

#zoomHint {
    top: 25px;

    color:
        rgba(255,255,255,0.28);

    font-size: 11px;
    letter-spacing: 1px;
}

.show {
    opacity: 1 !important;
}

@keyframes pulse {
    0%,100% {
        transform: scale(.7);
        opacity: .45;
    }

    50% {
        transform: scale(1.8);
        opacity: 1;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div id="intro">

    <div class="intro-dot"></div>

    <div id="introText">
        Иногда, чтобы узнать человека,<br>
        нужно заглянуть немного глубже…
    </div>

    <button id="enterButton">
        Войти
    </button>

</div>

<div id="hint">
    Нажмите на сердце
</div>

<div id="maskHint">
    Нажмите на маску
</div>

<div id="zoomHint">
    Колесо мыши — приблизить / отдалить
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   ОСНОВА
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x010005);


const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


/*
    Начальная дистанция.
*/
let cameraDistance = 35;

camera.position.set(
    0,
    2,
    cameraDistance
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.domElement.style.touchAction =
    "none";

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PARTICLE TEXTURE
========================================================= */

function createParticleTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.12,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.3,
        "rgba(255,110,155,.8)"
    );

    gradient.addColorStop(
        0.6,
        "rgba(255,20,90,.28)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,0,70,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        128,
        128
    );

    return new THREE.CanvasTexture(
        canvas
    );
}


const particleTexture =
    createParticleTexture();


/* =========================================================
   BACKGROUND
========================================================= */

const backgroundCount = 9000;

const backgroundPositions =
    new Float32Array(
        backgroundCount * 3
    );

for (
    let i = 0;
    i < backgroundCount;
    i++
) {

    const i3 = i * 3;

    const radius =
        65 +
        Math.random() * 170;

    const theta =
        Math.random() *
        Math.PI *
        2;

    const phi =
        Math.acos(
            2 *
            Math.random() -
            1
        );

    backgroundPositions[i3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    backgroundPositions[i3 + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    backgroundPositions[i3 + 2] =
        radius *
        Math.cos(phi);
}


const backgroundGeometry =
    new THREE.BufferGeometry();

backgroundGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        backgroundPositions,
        3
    )
);


const backgroundMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0x6d1740,

        size:
            .30,

        transparent:
            true,

        opacity:
            .38,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        sizeAttenuation:
            true
    });


const backgroundParticles =
    new THREE.Points(
        backgroundGeometry,
        backgroundMaterial
    );

scene.add(
    backgroundParticles
);


/* =========================================================
   HEART
========================================================= */

const heartGroup =
    new THREE.Group();

scene.add(
    heartGroup
);

heartGroup.position.y =
    2.5;


/*
    Большое объёмное сердце.

    Здесь используется
    математическая формула сердца.
*/

const heartCount =
    42000;

const heartPositions =
    new Float32Array(
        heartCount * 3
    );

const heartOriginal =
    new Float32Array(
        heartCount * 3
    );


function heartInside(x, y) {

    const a =
        x * x +
        y * y -
        1;

    return (
        a * a * a -
        x * x *
        y * y * y
    ) <= 0;
}


for (
    let i = 0;
    i < heartCount;
    i++
) {

    const i3 =
        i * 3;

    let x;
    let y;

    /*
        Rejection sampling.
    */

    while (true) {

        x =
            -1.35 +
            Math.random() * 2.7;

        y =
            -1.25 +
            Math.random() * 2.55;

        if (
            heartInside(
                x,
                y
            )
        ) {
            break;
        }
    }


    /*
        Делаем внутреннюю
        плотность немного неравномерной.
    */

    const radial =
        Math.sqrt(
            x * x +
            y * y
        );

    const depth =
        Math.sqrt(
            Math.max(
                0,
                1 -
                Math.min(
                    radial,
                    1
                )
            )
        );


    let z =
        (
            Math.random() -
            .5
        ) *
        (
            2.8 +
            depth * 4.5
        );


    /*
        Передняя часть сердца.
    */

    z +=
        Math.pow(
            Math.max(
                0,
                1 -
                radial
            ),
            2
        ) *
        1.6;


    /*
        Масштаб.
    */

    x *= 9.5;
    y *= 9.0;
    z *= 1.75;


    /*
        Немного делаем форму
        мягче и объёмнее.
    */

    x *=
        1 +
        Math.sin(
            y * .8
        ) * .025;

    y *=
        1 +
        Math.sin(
            x * .45
        ) * .018;


    heartPositions[i3] =
        x;

    heartPositions[i3 + 1] =
        y;

    heartPositions[i3 + 2] =
        z;


    heartOriginal[i3] =
        x;

    heartOriginal[i3 + 1] =
        y;

    heartOriginal[i3 + 2] =
        z;
}


const heartGeometry =
    new THREE.BufferGeometry();

heartGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        heartPositions,
        3
    )
);


const heartMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xff315f,

        size:
            .12,

        transparent:
            true,

        opacity:
            .95,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending,

        sizeAttenuation:
            true
    });


const heart =
    new THREE.Points(
        heartGeometry,
        heartMaterial
    );

heartGroup.add(
    heart
);


/* =========================================================
   HEART GLOW
========================================================= */

const heartGlowMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xff174f,

        size:
            .43,

        transparent:
            true,

        opacity:
            .13,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const heartGlow =
    new THREE.Points(
        heartGeometry,
        heartGlowMaterial
    );

heartGroup.add(
    heartGlow
);


/* =========================================================
   БЕЛЫЕ ЧАСТИЦЫ ВОКРУГ СЕРДЦА
========================================================= */

const whiteCount =
    11000;

const whitePositions =
    new Float32Array(
        whiteCount * 3
    );

const whiteData =
    [];


for (
    let i = 0;
    i < whiteCount;
    i++
) {

    const i3 =
        i * 3;

    const side =
        Math.random() <
        .5
        ? -1
        : 1;

    const t =
        Math.random();

    /*
        Широкая дуга.
    */

    const angle =
        Math.PI *
        (.05 +
        t * .95);

    const radius =
        5 +
        Math.random() *
        9;

    let x =
        side *
        (
            3.5 +
            Math.cos(angle) *
            radius
        );

    let y =
        .3 +
        Math.sin(angle) *
        6;

    let z =
        (
            Math.random() -
            .5
        ) *
        9;

    /*
        Дополнительное движение
        ближе к сердцу.
    */

    x +=
        Math.sin(
            t * 15
        ) *
        .8;

    y +=
        Math.cos(
            t * 10
        ) *
        .5;


    whitePositions[i3] =
        x;

    whitePositions[i3 + 1] =
        y;

    whitePositions[i3 + 2] =
        z;


    whiteData.push({

        side,

        t,

        phase:
            Math.random() *
            Math.PI *
            2,

        speed:
            .001 +
            Math.random() *
            .003
    });
}


const whiteGeometry =
    new THREE.BufferGeometry();

whiteGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        whitePositions,
        3
    )
);


const whiteMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffffff,

        size:
            .10,

        transparent:
            true,

        opacity:
            .86,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const whiteParticles =
    new THREE.Points(
        whiteGeometry,
        whiteMaterial
    );

scene.add(
    whiteParticles
);


/* =========================================================
   НИЖНИЕ БЕЛЫЕ ПОТОКИ
========================================================= */

const lowerCount =
    12500;

const lowerPositions =
    new Float32Array(
        lowerCount * 3
    );

const lowerData =
    [];


for (
    let i = 0;
    i < lowerCount;
    i++
) {

    const i3 =
        i * 3;

    const side =
        Math.random() <
        .5
        ? -1
        : 1;

    const t =
        Math.random();

    /*
        t = 0
        около сердца.

        t = 1
        далеко внизу.
    */

    const y =
        -3.8 -
        t * 10.5;

    /*
        Поток расширяется
        книзу.
    */

    const width =
        1.2 +
        t * 13;

    /*
        Изгиб потока.
    */

    const wave =
        Math.sin(
            t * 10 +
            side * 1.5
        ) *
        (
            1 +
            t * 3
        );

    let x =
        side *
        (
            1.0 +
            t * 2.0
        ) +
        (
            Math.random() -
            .5
        ) *
        width +
        wave;


    /*
        Сильнее собираем
        верхнюю часть.
    */

    if (t < .18) {

        x *=
            .5 +
            t * 2;
    }


    /*
        Глубина.
    */

    const z =
        (
            Math.random() -
            .5
        ) *
        (
            .8 +
            t * 8
        );


    lowerPositions[i3] =
        x;

    lowerPositions[i3 + 1] =
        y;

    lowerPositions[i3 + 2] =
        z;


    lowerData.push({

        side,

        t,

        phase:
            Math.random() *
            Math.PI *
            2,

        speed:
            .002 +
            Math.random() *
            .006
    });
}


const lowerGeometry =
    new THREE.BufferGeometry();

lowerGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        lowerPositions,
        3
    )
);


const lowerMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffffff,

        size:
            .105,

        transparent:
            true,

        opacity:
            .72,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const lowerParticles =
    new THREE.Points(
        lowerGeometry,
        lowerMaterial
    );

scene.add(
    lowerParticles
);


/* =========================================================
   ОТРАЖЕНИЕ ПОД СЕРДЦЕМ
========================================================= */

const reflectionCount =
    6500;

const reflectionPositions =
    new Float32Array(
        reflectionCount * 3
    );

const reflectionData =
    [];


for (
    let i = 0;
    i < reflectionCount;
    i++
) {

    const i3 =
        i * 3;

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        Math.sqrt(
            Math.random()
        );

    const x =
        Math.cos(angle) *
        radius *
        13;

    const y =
        -13 -
        Math.random() *
        1.8;

    const z =
        Math.sin(angle) *
        radius *
        5;


    reflectionPositions[i3] =
        x;

    reflectionPositions[i3 + 1] =
        y;

    reflectionPositions[i3 + 2] =
        z;


    reflectionData.push({
        phase:
            Math.random() *
            Math.PI *
            2
    });
}


const reflectionGeometry =
    new THREE.BufferGeometry();

reflectionGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        reflectionPositions,
        3
    )
);


const reflectionMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffdce8,

        size:
            .075,

        transparent:
            true,

        opacity:
            .28,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const reflection =
    new THREE.Points(
        reflectionGeometry,
        reflectionMaterial
    );

scene.add(
    reflection
);


/* =========================================================
   ПОЛУМЕСЯЦ
========================================================= */

const moonGroup =
    new THREE.Group();

scene.add(
    moonGroup
);


const moonCount =
    5200;

const moonPositions =
    new Float32Array(
        moonCount * 3
    );


for (
    let i = 0;
    i < moonCount;
    i++
) {

    const i3 =
        i * 3;

    let x;
    let y;

    /*
        Генерируем диск.
    */

    while (true) {

        x =
            -1 +
            Math.random() * 2;

        y =
            -1 +
            Math.random() * 2;

        if (
            x*x +
            y*y <=
            1
        ) {

            /*
                Вырезаем часть
                для полумесяца.
            */

            const cutX =
                x + .42;

            const cutY =
                y + .05;

            if (
                cutX * cutX +
                cutY * cutY >
                .76 * .76
            ) {
                break;
            }
        }
    }


    const z =
        (
            Math.random() -
            .5
        ) *
        .35;


    moonPositions[i3] =
        x * 4.1;

    moonPositions[i3 + 1] =
        y * 4.1;

    moonPositions[i3 + 2] =
        z;
}


const moonGeometry =
    new THREE.BufferGeometry();

moonGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        moonPositions,
        3
    )
);


const moonMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xfff2bd,

        size:
            .12,

        transparent:
            true,

        opacity:
            .95,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const moon =
    new THREE.Points(
        moonGeometry,
        moonMaterial
    );

moonGroup.add(
    moon
);


/*
    Маленькое дополнительное
    свечение вокруг луны.
*/

const moonGlowMaterial =
    new THREE.PointsMaterial({

        map:
            particleTexture,

        color:
            0xffe9a0,

        size:
            .38,

        transparent:
            true,

        opacity:
            .12,

        depthWrite:
            false,

        blending:
            THREE.AdditiveBlending
    });


const moonGlow =
    new THREE.Points(
        moonGeometry,
        moonGlowMaterial
    );

moonGroup.add(
    moonGlow
);


/* =========================================================
   ONI MASK
========================================================= */

const maskGroup =
    new THREE.Group();

scene.add(
    maskGroup
);

maskGroup.position.set(
    14,
    2,
    -3
);

maskGroup.rotation.y =
    -.25;


const maskCount =
    11000;

const maskPositions =
    new Float32Array(
        maskCount * 3
    );

const maskOriginal =
    new Float32Array(
        maskCount * 3
    );


function randomMaskPoint() {

    const section =
        Math.random();


    /*
        Лицо.
    */

    if (section < .70) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const radius =
            Math.sqrt(
                Math.random()
            );

        const width =
            4.4;

        const height =
            5.6;

        let x =
            Math.cos(angle) *
            radius *
            width;

        let y =
            Math.sin(angle) *
            radius *
            height;


        /*
            Щёки.
        */

        if (
            y < -1
        ) {

            x *=
                1.15;
        }


        const z =
            Math.sqrt(
                Math.max(
                    0,
                    1 -
                    radius
                )
            ) *
            2.3;


        return [
            x,
            y,
            z
        ];
    }


    /*
        Рога.
    */

    if (section < .82) {

        const side =
            Math.random() <
            .5
            ? -1
            : 1;

        const t =
            Math.random();

        const x =
            side *
            (
                3.1 +
                t * 3.3
            );

        const y =
            3.2 +
            t * 4.4;

        const z =
            (
                Math.random() -
                .5
            ) *
            .8;

        return [
            x,
            y,
            z
        ];
    }


    /*
        Глаза.
    */

    if (section < .91) {

        const side =
            Math.random() <
            .5
            ? -1
            : 1;

        const angle =
            Math.random() *
            Math.PI *
            2;

        const rx =
            1.35;

        const ry =
            .65;

        return [
            side * 1.75 +
            Math.cos(angle) *
            rx,

            .75 +
            Math.sin(angle) *
            ry,

            2.4 +
            Math.random() *
            .7
        ];
    }


    /*
        Рот.
    */

    const angle =
        Math.random() *
        Math.PI;

    return [

        Math.cos(angle) *
        2.8,

        -2.0 +
        Math.sin(angle) *
        .7,

        2.2 +
        Math.random() *
        .5
    ];
}


for (
    let i = 0;
    i < maskCount;
    i++
) {

    const i3 =
        i * 3;

    const point =
        randomMaskPoint();

    maskPositions[i3] =
        point[0];

    maskPositions[i3 + 1] =
        point[1];

/* =========================================================
   MASK EXPLOSION
========================================================= */

let maskState =
    "normal";

let maskExplosionTime =
    0;


function explodeMask() {

    if (
        maskState !==
        "normal"
    ) {
        return;
    }

    maskState =
        "exploding";

    maskExplosionTime =
        0;

    document
        .getElementById(
            "maskHint"
        )
        .classList.remove(
            "show"
        );
}


function updateMaskExplosion(
    delta
) {

    if (
        maskState ===
        "normal"
    ) {
        return;
    }


    maskExplosionTime +=
        delta;


    const pos =
        mask.geometry
        .attributes
        .position
        .array;


    if (
        maskState ===
        "exploding"
    ) {

        for (
            let i = 0;
            i < maskCount;
            i++
        ) {

            const i3 =
                i * 3;

            let x =
                maskOriginal[i3];

            let y =
                maskOriginal[i3 + 1];

            let z =
                maskOriginal[i3 + 2];


            const length =
                Math.sqrt(
                    x*x +
                    y*y +
                    z*z
                ) || 1;


            const force =
                maskExplosionTime *
                5.5;


            x +=
                (
                    x / length
                ) *
                force;

            y +=
                (
                    y / length
                ) *
                force;

            z +=
                (
                    z / length
                ) *
                force;


            x +=
                Math.sin(
                    i * .37
                ) *
                maskExplosionTime *
                1.5;

            y +=
                Math.cos(
                    i * .21
                ) *
                maskExplosionTime *
                1.5;


            pos[i3] =
                x;

            pos[i3 + 1] =
                y;

            pos[i3 + 2] =
                z;
        }


        mask.geometry
            .attributes
            .position
            .needsUpdate =
            true;


        maskMaterial.opacity =
            Math.max(
                0,
                1 -
                maskExplosionTime *
                1.5
            );


        if (
            maskExplosionTime >
            1.1
        ) {

            maskState =
                "text";

            textGroup.visible =
                true;

            textParticle.material.opacity =
                0;
        }

        return;
    }


    if (
        maskState ===
        "text"
    ) {

        textParticle.material.opacity =
            Math.min(
                1,
                textParticle.material.opacity +
                delta *
                1.4
            );


        textGroup.rotation.y +=
            delta *
            .15;

        return;
    }
}

function formatTogetherTime() {

    const start =
        new Date(
            "2026-08-31T00:00:00"
        );

    const now =
        new Date();

    let seconds =
        Math.floor(
            (
                now - start
            ) / 1000
        );

    if (
        seconds < 0
    ) {
        seconds = 0;
    }


    const days =
        Math.floor(
            seconds /
            86400
        );

    seconds %=
        86400;

    const hours =
        Math.floor(
            seconds /
            3600
        );

    seconds %=
        3600;

    const minutes =
        Math.floor(
            seconds /
            60
        );

    seconds %=
        60;


    return (
        days +
        " Д " +
        String(hours)
            .padStart(2,"0") +
        ":" +
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(seconds)
            .padStart(2,"0")
    );
}

/* =========================================================
   CAMERA CONTROL
========================================================= */

let targetYaw =
    0;

let targetPitch =
    0;

let currentYaw =
    0;

let currentPitch =
    0;


/*
    Ограничения zoom.
*/

const MIN_DISTANCE =
    16;

const MAX_DISTANCE =
    65;


/*
    Колесо мыши.
*/

renderer.domElement.addEventListener(
    "wheel",
    (event) => {

        event.preventDefault();

        cameraDistance +=
            event.deltaY *
            .025;

        cameraDistance =
            THREE.MathUtils.clamp(
                cameraDistance,
                MIN_DISTANCE,
                MAX_DISTANCE
            );
    },
    {
        passive: false
    }
);


/*
    Drag мышью.
*/

let mouseDown =
    false;

let lastMouseX =
    0;

let lastMouseY =
    0;


renderer.domElement.addEventListener(
    "pointerdown",
    (event) => {

        mouseDown =
            true;

        lastMouseX =
            event.clientX;

        lastMouseY =
            event.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    (event) => {

        if (
            !mouseDown
        ) {
            return;
        }


        const dx =
            event.clientX -
            lastMouseX;

        const dy =
            event.clientY -
            lastMouseY;


        lastMouseX =
            event.clientX;

        lastMouseY =
            event.clientY;


        targetYaw +=
            dx * .004;

        targetPitch +=
            dy * .003;


        targetPitch =
            THREE.MathUtils.clamp(
                targetPitch,
                -.8,
                .8
            );
    }
);


window.addEventListener(
    "pointerup",
    () => {

        mouseDown =
            false;
    }
);


/* =========================================================
   TOUCH ZOOM
========================================================= */

let lastPinchDistance =
    null;


renderer.domElement.addEventListener(
    "touchstart",
    (event) => {

        if (
            event.touches.length ===
            2
        ) {

            const dx =
                event.touches[0].clientX -
                event.touches[1].clientX;

            const dy =
                event.touches[0].clientY -
                event.touches[1].clientY;

            lastPinchDistance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );
        }
    },
    {
        passive: false
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    (event) => {

        if (
            event.touches.length !==
            2
        ) {
            return;
        }

        event.preventDefault();


        const dx =
            event.touches[0].clientX -
            event.touches[1].clientX;

        const dy =
            event.touches[0].clientY -
            event.touches[1].clientY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            lastPinchDistance !==
            null
        ) {

            const difference =
                distance -
                lastPinchDistance;

            cameraDistance -=
                difference *
                .035;

            cameraDistance =
                THREE.MathUtils.clamp(
                    cameraDistance,
                    MIN_DISTANCE,
                    MAX_DISTANCE
                );
        }


        lastPinchDistance =
            distance;
    },
    {
        passive: false
    }
);


renderer.domElement.addEventListener(
    "touchend",
    () => {

        lastPinchDistance =
            null;
    }
);


/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();

raycaster.params.Points.threshold =
    .75;

const pointer =
    new THREE.Vector2();


function pointerFromEvent(
    event
) {

    const rect =
        renderer.domElement
        .getBoundingClientRect();

    pointer.x =
        (
            event.clientX -
            rect.left
        ) /
        rect.width *
        2 -
        1;

    pointer.y =
        -(
            (
                event.clientY -
                rect.top
            ) /
            rect.height *
            2 -
            1
        );
}


renderer.domElement.addEventListener(
    "click",
    (event) => {

        /*
            Не обрабатываем
            click после drag.
        */

        pointerFromEvent(
            event
        );


        raycaster.setFromCamera(
            pointer,
            camera
        );


        /*
            Маска.
        */

        if (
            maskState ===
            "normal"
        ) {

            const maskHits =
                raycaster.intersectObject(
                    mask,
                    false
                );

            if (
                maskHits.length
            ) {

                explodeMask();

                return;
            }
        }


        /*
            Сердце.
        */

        if (
            heartState ===
            "normal" ||
            heartState ===
            "toHeart"
        ) {

            const heartHits =
                raycaster.intersectObject(
                    heart,
                    false
                );

            if (
                heartHits.length
            ) {

                toggleHeartTime();
            }
        }
    }
);


/* =========================================================
   HEART ANIMATION
========================================================= */

function updateHeart(
    time,
    delta
) {

    /*
        Плавное вращение.
    */

    heartGroup.rotation.y +=
        delta *
        .16;


    heartGroup.rotation.x =
        Math.sin(
            time * .00045
        ) *
        .055;


    /*
        Пульсация.
    */

    const pulse =
        1 +
        Math.sin(
            time * .003
        ) *
        .045;


    heart.scale.set(
        pulse,
        pulse,
        pulse
    );


    heartGlow.scale.set(
        1.03 * pulse,
        1.03 * pulse,
        1.03 * pulse
    );


    /*
        Лёгкое движение
        отдельных частиц.
    */

    const positions =
        heart.geometry
        .attributes
        .position
        .array;


    for (
        let i = 0;
        i < heartCount;
        i += 8
    ) {

        const i3 =
            i * 3;

        positions[i3] =
            heartOriginal[i3] +
            Math.sin(
                time * .0015 +
                i
            ) *
            .018;

        positions[i3 + 1] =
            heartOriginal[i3 + 1] +
            Math.cos(
                time * .0013 +
                i
            ) *
            .018;

        positions[i3 + 2] =
            heartOriginal[i3 + 2] +
            Math.sin(
                time * .001 +
                i
            ) *
            .025;
    }

    heart.geometry
        .attributes
        .position
        .needsUpdate =
        true;


    /*
        Переход сердце → время.
    */

    if (
        heartState ===
        "toTime"
    ) {

        heartTransition +=
            delta;


        const progress =
            Math.min(
                1,
                heartTransition *
                .9
            );


        const eased =
            progress *
            progress *
            (
                3 -
                2 *
                progress
            );


        heart.material.opacity =
            1 -
            eased;


        heartGlow.material.opacity =
            .13 *
            (
                1 -
                eased
            );


        timePoints.material.opacity =
            eased;


        if (
            progress >=
            1
        ) {

            heartState =
                "time";
        }

        return;
    }


    /*
        Время → сердце.
    */

    if (
        heartState ===
        "toHeart"
    ) {

        heartTransition +=
            delta;


        const progress =
            Math.min(
                1,
                heartTransition *
                .9
            );


        const eased =
            progress *
            progress *
            (
                3 -
                2 *
                progress
            );


        timePoints.material.opacity =
            1 -
            eased;


        heart.material.opacity =
            eased;


        heartGlow.material.opacity =
            .13 *
            eased;


        if (
            progress >=
            1
        ) {

            timeGroup.visible =
                false;

            heartState =
                "normal";
        }
    }


    /*
        Обновляем время
        каждую секунду.
    */

    if (
        heartState ===
        "time"
    ) {

        if (
            Math.floor(
                time * .001
            ) !==
            Math.floor(
                (time - delta * 1000) *
                .001
            )
        ) {

            createTimeParticles();

            timePoints.material.opacity =
                1;
        }
    }
}


/* =========================================================
   WHITE PARTICLES
========================================================= */

function updateWhite(
    time
) {

    const positions =
        whiteGeometry
        .attributes
        .position
        .array;


    for (
        let i = 0;
        i < whiteCount;
        i++
    ) {

        const i3 =
            i * 3;

        const data =
            whiteData[i];


        const wave =
            Math.sin(
                time * data.speed * 1000 +
                data.phase
            );


        const angle =
            data.t *
            Math.PI +
            wave *
            .05;


        const radius =
            5 +
            data.t * 9;


        positions[i3] =
            data.side *
            (
                3.5 +
                Math.cos(angle) *
                radius
            );


        positions[i3 + 1] =
            .3 +
            Math.sin(angle) *
            6 +
            wave *
            .4;


        positions[i3 + 2] +=
            Math.sin(
                time * .0006 +
                data.phase
            ) *
            .004;
    }


    whiteGeometry
        .attributes
        .position
        .needsUpdate =
        true;
}


/* =========================================================
   LOWER FLOW
========================================================= */

function updateLower(
    time
) {

    const positions =
        lowerGeometry
        .attributes
        .position
        .array;


    for (
        let i = 0;
        i < lowerCount;
        i++
    ) {

        const i3 =
            i * 3;

        const data =
            lowerData[i];


        /*
            Движение вдоль потока.
        */

        let t =
            data.t +
            data.speed;


        if (
            t > 1
        ) {
            t -= 1;
        }


        data.t =
            t;


        const width =
            1.2 +
            t * 13;


        const wave =
            Math.sin(
                t * 10 +
                data.phase +
                time * .0006
            ) *
            (
                1 +
                t * 3
            );


        let x =
            data.side *
            (
                1 +
                t * 2
            ) +
            Math.sin(
                data.phase +
                t * 7
            ) *
            width *
            .23 +
            wave;


        x +=
            (
                Math.random() -
                .5
            ) *
            .035 *
            width;


        if (
            t < .18
        ) {

            x *=
                .5 +
                t * 2;
        }


        positions[i3] =
            x;

        positions[i3 + 1] =
            -3.8 -
            t * 10.5;

        positions[i3 + 2] =
            Math.sin(
                t * 8 +
                data.phase
            ) *
            (
                .5 +
                t * 4
            );
    }


    lowerGeometry
        .attributes
        .position
        .needsUpdate =
        true;
}

/* =========================================================
   MOON ORBIT
========================================================= */

function updateMoon(
    time
) {

    /*
        Луна далеко за сердцем.
    */

    const angle =
        time *
        .00012;


    const orbitX =
        23;

    const orbitZ =
        17;


    moonGroup.position.x =
        Math.cos(angle) *
        orbitX;


    moonGroup.position.z =
        Math.sin(angle) *
        orbitZ -
        3;


    moonGroup.position.y =
        8 +
        Math.sin(
            angle * 1.7
        ) *
        3;


    /*
        Полумесяц всегда
        немного повёрнут.
    */

    moonGroup.rotation.x =
        Math.sin(
            angle
        ) *
        .25;

    moonGroup.rotation.y =
        -angle -
        .6;

    moonGroup.rotation.z =
        .25;
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
    time
) {

    currentYaw +=
        (
            targetYaw -
            currentYaw
        ) *
        .055;


    currentPitch +=
        (
            targetPitch -
            currentPitch
        ) *
        .055;


    const target =
        new THREE.Vector3(
            0,
            1,
            0
        );


    const x =
        Math.sin(
            currentYaw
        ) *
        Math.cos(
            currentPitch
        ) *
        cameraDistance;


    const y =
        target.y +
        Math.sin(
            currentPitch
        ) *
        cameraDistance;


    const z =
        Math.cos(
            currentYaw
        ) *
        Math.cos(
            currentPitch
        ) *
        cameraDistance;


    camera.position.x =
        x;

    camera.position.y =
        y;

    camera.position.z =
        z;


    camera.lookAt(
        target
    );
}

========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   INTRO
========================================================= */

const intro =
    document.getElementById(
        "intro"
    );

const enterButton =
    document.getElementById(
        "enterButton"
    );


enterButton.addEventListener(
    "click",
    () => {

        intro.classList.add(
            "hidden"
        );


        setTimeout(
            () => {

                document
                    .getElementById(
                        "hint"
                    )
                    .classList.add(
                        "show"
                    );

                document
                    .getElementById(
                        "maskHint"
                    )
                    .classList.add(
                        "show"
                    );

                document
                    .getElementById(
                        "zoomHint"
                    )
                    .classList.add(
                        "show"
                    );

            },
            1400
        );


        setTimeout(
            () => {

                document
                    .getElementById(
                        "zoomHint"
                    )
                    .classList.remove(
                        "show"
                    );

            },
            6500
        );
    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

const clock =
    new THREE.Clock();

let elapsed =
    0;


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    elapsed +=
        delta;


    const time =
        elapsed *
        1000;


    updateHeart(
        time,
        delta
    );

    updateWhite(
        time
    );

    updateLower(
        time
    );

    updateReflection(
        time
    );

    updateMoon(
        time
    );

    updateBackground(
        time,
        delta
    );

    updateMaskExplosion(
        delta
    );

    updateCamera(
        time
    );


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>
