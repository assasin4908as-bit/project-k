<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Проект К</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020006;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .title {
            position: fixed;
            left: 50%;
            bottom: 7%;

            transform: translateX(-50%);

            color: rgba(255, 220, 235, 0.8);

            font-size: 18px;
            letter-spacing: 1px;

            text-align: center;

            pointer-events: none;

            text-shadow:
                0 0 10px rgba(255, 30, 90, 0.7),
                0 0 30px rgba(255, 0, 70, 0.4);
        }
    </style>
</head>

<body>

    <canvas id="scene"></canvas>

    <div class="title">
        Нажмите на сердце, чтобы узнать меня лучше
    </div>


    <script type="module">

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


        /* =====================================================
           ОСНОВА THREE.JS
        ===================================================== */

        const canvas =
            document.getElementById("scene");


        const renderer =
            new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setClearColor(
            0x020006,
            1
        );


        /* =====================================================
           СЦЕНА
        ===================================================== */

        const scene =
            new THREE.Scene();


        /* =====================================================
           КАМЕРА
        ===================================================== */

        const camera =
            new THREE.PerspectiveCamera(
                55,
                window.innerWidth /
                window.innerHeight,
                0.1,
                1000
            );


        camera.position.set(
            0,
            0,
            10
        );


        /* =====================================================
           WORLD
        ===================================================== */

        const world =
            new THREE.Group();


        scene.add(world);


        /* =====================================================
           PARTICLE TEXTURE
        ===================================================== */

        function createParticleTexture() {

            const canvas =
                document.createElement("canvas");

            canvas.width = 64;
            canvas.height = 64;


            const ctx =
                canvas.getContext("2d");


            const gradient =
                ctx.createRadialGradient(
                    32,
                    32,
                    0,
                    32,
                    32,
                    32
                );


            gradient.addColorStop(
                0,
                "rgba(255,255,255,1)"
            );


            gradient.addColorStop(
                0.15,
                "rgba(255,240,245,1)"
            );


            gradient.addColorStop(
                0.4,
                "rgba(255,70,120,0.9)"
            );


            gradient.addColorStop(
                0.7,
                "rgba(255,20,70,0.3)"
            );


            gradient.addColorStop(
                1,
                "rgba(255,0,50,0)"
            );


            ctx.fillStyle =
                gradient;


            ctx.fillRect(
                0,
                0,
                64,
                64
            );


            return new THREE.CanvasTexture(
                canvas
            );
        }


        const particleTexture =
            createParticleTexture();


        /* =====================================================
           PARTICLE MATERIAL
        ===================================================== */

        const heartMaterial =
            new THREE.PointsMaterial({

                map:
                    particleTexture,

                color:
                    0xff315f,

                size:
                    0.045,

                transparent:
                    true,

                opacity:
                    1,

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending,

                sizeAttenuation:
                    true
            });


        /* =====================================================
           HEART
        ===================================================== */

        const PARTICLES =
            18000;


        const positions =
            new Float32Array(
                PARTICLES * 3
            );


        /*
         * Создаём объёмное сердце.
         */

        for (
            let i = 0;
            i < PARTICLES;
            i++
        ) {

            const t =
                Math.random() *
                Math.PI *
                2;


            const fill =
                Math.pow(
                    Math.random(),
                    0.38
                );


            /*
             * Формула сердца.
             */

            const x =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                );


            const y =
                13 *
                    Math.cos(t)
                - 5 *
                    Math.cos(2 * t)
                - 2 *
                    Math.cos(3 * t)
                - Math.cos(4 * t);


            /*
             * Размер.
             */

            positions[i * 3] =
                x *
                0.155 *
                fill;


            positions[i * 3 + 1] =
                y *
                0.155 *
                fill;


            /*
             * Настоящая глубина.
             */

            positions[i * 3 + 2] =
                (
                    Math.random() -
                    0.5
                ) *
                1.15 *
                (
                    0.35 +
                    fill *
                    0.65
                );
        }


        /* =====================================================
           GEOMETRY
        ===================================================== */

        const heartGeometry =
            new THREE.BufferGeometry();


        heartGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                positions,
                3
            )
        );


        /* =====================================================
           PARTICLE HEART
        ===================================================== */

        const heart =
            new THREE.Points(
                heartGeometry,
                heartMaterial
            );


        world.add(
            heart
        );


        /* =====================================================
           ЗВЁЗДЫ НА ЗАДНЕМ ПЛАНЕ
        ===================================================== */

        const STAR_COUNT =
            5000;


        const starPositions =
            new Float32Array(
                STAR_COUNT * 3
            );


        for (
            let i = 0;
            i < STAR_COUNT;
            i++
        ) {

            const radius =
                5 +
                Math.random() *
                18;


            const angle =
                Math.random() *
                Math.PI *
                2;


            starPositions[i * 3] =
                Math.cos(angle) *
                radius;


            starPositions[i * 3 + 1] =
                Math.sin(angle) *
                radius *
                0.65;


            starPositions[i * 3 + 2] =
                (
                    Math.random() -
                    0.5
                ) *
                12;
        }


        const starGeometry =
            new THREE.BufferGeometry();


        starGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                starPositions,
                3
            )
        );


        const starMaterial =
            new THREE.PointsMaterial({

                map:
                    particleTexture,

                color:
                    0xffb6ce,

                size:
                    0.018,

                transparent:
                    true,

                opacity:
                    0.5,

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending
            });


        const stars =
            new THREE.Points(
                starGeometry,
                starMaterial
            );


        world.add(
            stars
        );


        /* =====================================================
           MOUSE
        ===================================================== */

        const mouse =
            new THREE.Vector2();


        window.addEventListener(
            "pointermove",
            event => {

                mouse.x =
                    (
                        event.clientX /
                        window.innerWidth
                    ) *
                    2 -
                    1;


                mouse.y =
                    -(
                        event.clientY /
                        window.innerHeight
                    ) *
                    2 +
                    1;
            }
        );


        /* =====================================================
           ANIMATION
        ===================================================== */

        const clock =
            new THREE.Clock();


        function animate() {

            requestAnimationFrame(
                animate
            );


            const time =
                clock.getElapsedTime();


            /*
             * Вращение сердца.
             */

            heart.rotation.y +=
                0.0045;


            heart.rotation.x =
                Math.sin(
                    time *
                    0.45
                ) *
                0.05;


            heart.rotation.z =
                Math.sin(
                    time *
                    0.35
                ) *
                0.025;


            /*
             * Лёгкое биение сердца.
             */

            const heartbeat =
                1 +
                Math.pow(
                    Math.max(
                        0,
                        Math.sin(
                            time *
                            2.4
                        )
                    ),
                    10
                ) *
                0.045;


            heart.scale.setScalar(
                heartbeat
            );


            /*
             * Звёзды медленно вращаются.
             */

            stars.rotation.y +=
                0.00025;


            stars.rotation.z +=
                0.0001;


            /*
             * Камера реагирует
             * на мышь.
             */

            camera.position.x +=
                (
                    mouse.x *
                    0.25 -
                    camera.position.x
                ) *
                0.02;


            camera.position.y +=
                (
                    mouse.y *
                    0.16 -
                    camera.position.y
                ) *
                0.02;


            camera.lookAt(
                0,
                0,
                0
            );


            renderer.render(
                scene,
                camera
            );
        }


        animate();


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );

    </script>

</body>
</html>
